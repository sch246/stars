<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星罗 · 宇宙</title>
<style>
  :root {
    --bg: #050508; --panel: #0e0e13cc; --line: #25252e; --text: #d8d8e0; --muted: #7a7a88;
    --accent: #4facfe; --warn: #ffaa00; --err: #ff4d4d;
  }
  @media (prefers-color-scheme: light) { :root { color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(10px); padding: 10px 12px; }
  #tools { top: 12px; left: 12px; width: 280px; }
  #tools input { width: 100%; background: #0a0a0e; border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font: inherit; outline: none; }
  #tools input:focus { border-color: var(--accent); }
  #chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { cursor: pointer; user-select: none; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip.on { color: var(--text); }
  .chip:not(.on) i { opacity: .25; }
  #status { margin-top: 8px; color: var(--muted); font-size: 12px; }
  #status b { color: var(--text); font-weight: 600; }
  #side { top: 12px; right: 12px; width: 320px; max-height: calc(100vh - 24px); overflow: auto; }
  #side h3 { margin: 0 0 4px; font-size: 14px; }
  #side .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  #side .sec { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  #side .sec > .t { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  .row { display: flex; gap: 6px; padding: 1px 0; cursor: default; }
  .row.link { cursor: pointer; } .row.link:hover { color: var(--accent); }
  .tag { color: var(--muted); }
  .sev-error { color: var(--err); } .sev-warn { color: var(--warn); } .sev-info { color: var(--muted); }
  .author { color: var(--accent); }
  #banner { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: #3a1114; color: #ffb4b4;
    border: 1px solid var(--err); border-radius: 8px; padding: 6px 12px; display: none; max-width: 60vw; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: inherit; }
  @media (max-width: 760px) { #side { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner"></div>
<div class="panel" id="tools">
  <input id="q" placeholder="过滤节点… ( / )" autocomplete="off">
  <div id="chips"></div>
  <div id="status">连接中…</div>
</div>
<div class="panel" id="side"></div>
<div id="hint"><kbd>/</kbd> 过滤 · <kbd>Esc</kbd> 取消选择 · 点击节点聚焦 · 滚轮缩放 · 拖动平移/拖节点 · <kbd>F</kbd> 适应窗口</div>
<script src="/d3.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let data = { nodes: [], edges: [], issues: [], log: [] };
  let simNodes = [], simLinks = [];
  const nodeById = new Map();
  let schema = new Map();           // 类型名 -> 模式节点
  let hiddenTypes = new Set(['dir', 'file']); // 默认先收起扫描出来的文件噪声
  let showSchema = false;
  let selected = null, hovered = null, query = '';
  let transform = d3.zoomIdentity;
  let firstLoad = true;
  let issueByNode = new Map();
  const typesSeen = new Set();

  const hashColor = (s) => {
    let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return `hsl(${h % 360} 85% 62%)`;
  };
  const nodeColor = (n) => n.attrs.color || schema.get(n.attrs.type)?.attrs.color || (n.attrs.type ? hashColor(n.attrs.type) : '#e8e8f0');
  const edgeColor = (e) => schema.get(e.type)?.attrs.color || hashColor('edge:' + e.type);
  const isSym = (type) => schema.get(type)?.attrs.symmetric === 'true';
  const isSchema = (n) => n.id.startsWith('~');
  const typeOf = (n) => (isSchema(n) ? '~模式' : n.attrs.type || '(无类型)');

  const simulation = d3.forceSimulation()
    .force('link', d3.forceLink().id((d) => d.id).distance((l) => (l.type === 'contains' ? 34 : 90)).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-70).distanceMax(600))
    .force('center', d3.forceCenter(0, 0).strength(0.04))
    .force('collide', d3.forceCollide().radius((d) => d.r + 3))
    .alphaDecay(0.02)
    .on('tick', () => {});

  function visible(n) {
    if (isSchema(n)) return showSchema;
    return !hiddenTypes.has(typeOf(n));
  }

  function ingest(snap) {
    if (snap.error) { banner(snap.error); return; }
    banner(null);
    data = snap;
    schema = new Map(snap.nodes.filter(isSchema).map((n) => [n.id.slice(1), n]));
    issueByNode = new Map();
    for (const i of snap.issues) for (const id of i.nodes) {
      const cur = issueByNode.get(id);
      if (!cur || (i.severity === 'error') || (i.severity === 'warn' && cur !== 'error')) issueByNode.set(id, i.severity);
    }

    const prev = new Map(nodeById);
    nodeById.clear();
    const deg = new Map();
    for (const e of snap.edges) { deg.set(e.from, (deg.get(e.from) || 0) + 1); deg.set(e.to, (deg.get(e.to) || 0) + 1); }

    simNodes = snap.nodes.map((raw) => {
      const old = prev.get(raw.id);
      const n = Object.assign(old || { x: undefined, y: undefined, born: firstLoad ? 0 : performance.now() }, raw);
      n.deg = deg.get(raw.id) || 0;
      n.r = 3 + Math.sqrt(n.deg) * 1.7;
      nodeById.set(n.id, n);
      return n;
    });
    // 新节点出生在已有邻居旁边,而不是随机位置
    for (const n of simNodes) {
      if (n.x !== undefined) continue;
      const nb = snap.edges.map((e) => (e.from === n.id ? e.to : e.to === n.id ? e.from : null))
        .map((id) => id && nodeById.get(id)).find((m) => m && m.x !== undefined);
      n.x = (nb ? nb.x : 0) + (Math.random() - 0.5) * 30;
      n.y = (nb ? nb.y : 0) + (Math.random() - 0.5) * 30;
    }
    if (selected && !nodeById.has(selected)) selected = null;

    for (const n of simNodes) typesSeen.add(typeOf(n));
    rebuildGraph();
    renderChips();
    renderSide();
    $('status').innerHTML = `<b>${snap.nodes.filter((n) => !isSchema(n)).length}</b> 节点 · <b>${snap.edges.length}</b> 条边 · `
      + `<span class="sev-error">${snap.issues.filter((i) => i.severity === 'error').length} 错误</span> · `
      + `<span class="sev-warn">${snap.issues.filter((i) => i.severity === 'warn').length} 警告</span>`;
    if (firstLoad) { firstLoad = false; setTimeout(fit, 700); }
  }

  function rebuildGraph() {
    const vis = simNodes.filter(visible);
    const ids = new Set(vis.map((n) => n.id));
    simLinks = data.edges.filter((e) => ids.has(e.from) && ids.has(e.to)).map((e) => ({ ...e, source: e.from, target: e.to }));
    simulation.nodes(vis);
    simulation.force('link').links(simLinks);
    simulation.alpha(0.6).restart();
  }

  function banner(msg) {
    const b = $('banner');
    b.style.display = msg ? 'block' : 'none';
    b.textContent = msg ? '宇宙文件有误: ' + msg : '';
  }

  function renderChips() {
    const counts = new Map();
    for (const n of simNodes) counts.set(typeOf(n), (counts.get(typeOf(n)) || 0) + 1);
    const chips = [...counts].sort((a, b) => b[1] - a[1]).map(([t, c]) => {
      const sample = simNodes.find((n) => typeOf(n) === t);
      const on = t === '~模式' ? showSchema : !hiddenTypes.has(t);
      const color = t === '~模式' ? '#888' : nodeColor(sample);
      return `<span class="chip ${on ? 'on' : ''}" data-t="${esc(t)}"><i style="background:${color}"></i>${esc(t)} ${c}</span>`;
    });
    $('chips').innerHTML = chips.join('');
  }
  $('chips').addEventListener('click', (ev) => {
    const el = ev.target.closest('.chip'); if (!el) return;
    const t = el.dataset.t;
    if (t === '~模式') showSchema = !showSchema;
    else if (hiddenTypes.has(t)) hiddenTypes.delete(t); else hiddenTypes.add(t);
    rebuildGraph(); renderChips();
  });

  function renderSide() {
    const el = $('side');
    const n = selected && nodeById.get(selected);
    if (!n) {
      const feed = data.log.slice().reverse().slice(0, 14).map((e) =>
        `<div class="row"><span class="tag">#${e.n}</span><span class="author">${esc(e.author)}</span><span>${esc(summ(e))}</span></div>`).join('');
      const groups = new Map();
      for (const i of data.issues.filter((i) => i.severity !== 'info')) {
        const g = groups.get(i.rule) || { sev: i.severity, items: [] };
        g.items.push(i); groups.set(i.rule, g);
      }
      const issues = [...groups].map(([rule, g]) => g.items.length <= 3
        ? g.items.map((i) => `<div class="row sev-${g.sev}">${esc(i.message)}</div>`).join('')
        : `<div class="row sev-${g.sev}"><b>${g.items.length} × ${esc(rule)}</b></div><div class="row sev-${g.sev}" style="opacity:.7">例如 ${esc(g.items[0].message)}</div>`).join('');
      el.innerHTML = `<h3>宇宙</h3><div class="sub">点击任意节点查看它的关系</div>`
        + (issues ? `<div class="sec"><div class="t">需要关注</div>${issues}</div>` : '')
        + `<div class="sec"><div class="t">最近变更</div>${feed || '<span class="tag">暂无</span>'}</div>`;
      return;
    }
    const out = data.edges.filter((e) => e.from === n.id), inn = data.edges.filter((e) => e.to === n.id);
    const attrs = Object.entries(n.attrs).filter(([k]) => !['type', 'summary'].includes(k))
      .map(([k, v]) => `<div class="row"><span class="tag">${esc(k)}</span><span>${esc(v)}</span></div>`).join('');
    const edgeRow = (e, other, arrow) => `<div class="row link" data-id="${esc(other)}"><span class="tag">${arrow}</span>`
      + `<span style="color:${edgeColor(e)}">${esc(e.type)}</span><span>${esc(nodeById.get(other)?.label || other)}</span>`
      + (e.attrs.status ? `<span class="sev-warn">${esc(e.attrs.status)}</span>` : '') + '</div>';
    const myIssues = data.issues.filter((i) => i.nodes.includes(n.id));
    el.innerHTML = `<h3 style="color:${nodeColor(n)}">${esc(n.label)}</h3>
      <div class="sub">${esc(n.id)}${n.attrs.type ? ' · ' + esc(n.attrs.type) : ''}</div>
      ${n.attrs.summary ? `<p>${esc(n.attrs.summary)}</p>` : ''}
      ${attrs ? `<div class="sec">${attrs}</div>` : ''}
      <div class="sec"><div class="t">出边 ${out.length}</div>${out.map((e) => edgeRow(e, e.to, '→')).join('') || '<span class="tag">无</span>'}</div>
      <div class="sec"><div class="t">入边 ${inn.length}</div>${inn.map((e) => edgeRow(e, e.from, '←')).join('') || '<span class="tag">无</span>'}</div>
      ${myIssues.length ? `<div class="sec"><div class="t">问题</div>${myIssues.map((i) => `<div class="row sev-${i.severity}">${esc(i.message)}</div>`).join('')}</div>` : ''}`;
  }
  $('side').addEventListener('click', (ev) => {
    const el = ev.target.closest('.row.link'); if (!el) return;
    select(el.dataset.id, true);
  });
  const summ = (e) => {
    if (e.undoOf) return `撤销 #${e.undoOf}`;
    const o = e.op;
    switch (o.op) {
      case 'addNode': return `+ 节点 ${o.id}`; case 'removeNode': return `- 节点 ${o.id}`; case 'setNode': return `~ 节点 ${o.id}`;
      case 'addEdge': return `+ ${o.from} ${o.type} ${o.to}`; case 'removeEdge': return `- ${o.from} ${o.type} ${o.to}`;
      case 'setEdge': return `~ ${o.from} ${o.type} ${o.to}`; case 'batch': return `批量 ×${o.ops.length}`;
    }
    return o.op;
  };

  function select(id, center) {
    selected = id;
    const n = id && nodeById.get(id);
    if (n && !visible(n)) { hiddenTypes.delete(typeOf(n)); rebuildGraph(); renderChips(); }
    if (n && center) {
      const t = d3.zoomIdentity.translate(innerWidth / 2 - 100, innerHeight / 2).scale(transform.k).translate(-n.x, -n.y);
      d3.select(canvas).transition().duration(450).call(zoom.transform, t);
    }
    renderSide();
  }

  // --- 交互 ---
  const find = (px, py) => {
    const [x, y] = transform.invert([px, py]);
    return simulation.find(x, y, 14 / transform.k + 4);
  };
  const zoom = d3.zoom().scaleExtent([0.1, 8])
    .filter((ev) => !(ev.type === 'mousedown' && find(ev.offsetX, ev.offsetY)) && !ev.button)
    .on('zoom', (ev) => { transform = ev.transform; });
  d3.select(canvas).call(zoom).on('dblclick.zoom', null);

  d3.select(canvas).call(d3.drag()
    .subject((ev) => find(ev.x, ev.y))
    .on('start', (ev) => { if (!ev.active) simulation.alphaTarget(0.25).restart(); ev.subject.fx = ev.subject.x; ev.subject.fy = ev.subject.y; ev.subject.moved = false; })
    .on('drag', (ev) => { const [x, y] = transform.invert([ev.sourceEvent.offsetX, ev.sourceEvent.offsetY]); ev.subject.fx = x; ev.subject.fy = y; ev.subject.moved = true; })
    .on('end', (ev) => { if (!ev.active) simulation.alphaTarget(0); ev.subject.fx = null; ev.subject.fy = null; if (!ev.subject.moved) select(ev.subject.id, false); }));

  canvas.addEventListener('mousemove', (ev) => { hovered = find(ev.offsetX, ev.offsetY) || null; canvas.style.cursor = hovered ? 'pointer' : 'default'; });
  canvas.addEventListener('click', (ev) => { if (!find(ev.offsetX, ev.offsetY)) select(null); });
  $('q').addEventListener('input', (ev) => { query = ev.target.value.trim().toLowerCase(); });
  addEventListener('keydown', (ev) => {
    if (ev.key === '/' && document.activeElement !== $('q')) { ev.preventDefault(); $('q').focus(); }
    else if (ev.key === 'Escape') { $('q').blur(); $('q').value = ''; query = ''; select(null); }
    else if ((ev.key === 'f' || ev.key === 'F') && document.activeElement !== $('q')) fit();
  });

  function fit() {
    const vis = simulation.nodes();
    if (!vis.length) return;
    const xs = vis.map((n) => n.x), ys = vis.map((n) => n.y);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const k = Math.min(2, 0.85 * Math.min(innerWidth / Math.max(60, x1 - x0), innerHeight / Math.max(60, y1 - y0)));
    const t = d3.zoomIdentity.translate(innerWidth / 2, innerHeight / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    d3.select(canvas).transition().duration(600).call(zoom.transform, t);
  }

  // --- 绘制 ---
  function resize() {
    const dpr = devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  }
  addEventListener('resize', resize); resize();

  const matches = (n) => !query || `${n.id} ${n.label} ${n.attrs.summary || ''}`.toLowerCase().includes(query);

  function draw(now) {
    const dpr = devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.save();
    ctx.translate(transform.x, transform.y); ctx.scale(transform.k, transform.k);

    const focus = selected ? new Set([selected]) : null;
    if (focus) for (const l of simLinks) { if (l.source.id === selected) focus.add(l.target.id); if (l.target.id === selected) focus.add(l.source.id); }
    const alphaOf = (n) => (query && !matches(n) ? 0.08 : focus && !focus.has(n.id) ? 0.18 : 1);

    // 边
    for (const l of simLinks) {
      const a = l.source, b = l.target;
      if (a.x === undefined || b.x === undefined) continue;
      const alpha = Math.min(alphaOf(a), alphaOf(b));
      const proposed = l.attrs.status === 'proposed';
      const hot = focus && (l.source.id === selected || l.target.id === selected);
      ctx.globalAlpha = alpha * (hot ? 0.95 : 0.5);
      ctx.strokeStyle = proposed ? '#ffd24a' : edgeColor(l);
      ctx.lineWidth = (hot ? 1.8 : 1) / transform.k * (l.type === 'contains' ? 0.8 : 1.3);
      ctx.setLineDash(proposed ? [5 / transform.k, 4 / transform.k] : []);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      if (!isSym(l.type) && l.type !== 'contains') {
        const ang = Math.atan2(b.y - a.y, b.x - a.x), s = 6 / transform.k;
        const tx = b.x - Math.cos(ang) * (b.r + 2), ty = b.y - Math.sin(ang) * (b.r + 2);
        ctx.setLineDash([]); ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath(); ctx.moveTo(tx, ty);
        ctx.lineTo(tx - Math.cos(ang - 0.4) * s, ty - Math.sin(ang - 0.4) * s);
        ctx.lineTo(tx - Math.cos(ang + 0.4) * s, ty - Math.sin(ang + 0.4) * s);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.setLineDash([]);

    // 节点
    const nodes = simulation.nodes();
    for (const n of nodes) {
      if (n.x === undefined) continue;
      const color = nodeColor(n);
      const a = alphaOf(n);
      ctx.globalAlpha = a;
      ctx.shadowColor = color; ctx.shadowBlur = (n.id === selected || n === hovered ? 24 : 10) * transform.k;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
      ctx.shadowBlur = 0;
      const sev = issueByNode.get(n.id);
      if (sev === 'error' || sev === 'warn') {
        ctx.strokeStyle = sev === 'error' ? '#ff4d4d' : '#ffaa00'; ctx.lineWidth = 1.5 / transform.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3, 0, 6.2832); ctx.stroke();
      }
      if (n.id === selected) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / transform.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5, 0, 6.2832); ctx.stroke();
      }
      const age = now - (n.born || -1e9);
      if (age < 1600) { // 新生节点的扩散环
        const p = age / 1600;
        ctx.globalAlpha = (1 - p) * 0.9; ctx.strokeStyle = color; ctx.lineWidth = 2 / transform.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4 + p * 46, 0, 6.2832); ctx.stroke();
      }
    }

    // 标签:放大时、聚焦邻居、悬停、搜索命中、枢纽节点
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const fs = 11 / Math.max(transform.k, 0.6);
    ctx.font = `${fs}px -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.lineJoin = 'round';
    for (const n of nodes) {
      if (n.x === undefined) continue;
      const show = n === hovered || n.id === selected || (focus && focus.has(n.id)) || (query && matches(n))
        || transform.k > 1.6 || n.deg >= 5 || nodes.length <= 40;
      if (!show) continue;
      ctx.globalAlpha = Math.max(alphaOf(n), 0.5) * (n.deg >= 5 || transform.k > 1.6 || n === hovered || focus || nodes.length <= 40 ? 1 : 0.8);
      ctx.strokeStyle = '#050508'; ctx.lineWidth = 3 / Math.max(transform.k, 0.6);
      ctx.strokeText(n.label, n.x, n.y + n.r + 3);
      ctx.fillStyle = '#e6e6ee'; ctx.fillText(n.label, n.x, n.y + n.r + 3);
    }
    ctx.restore();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // --- 实时连接 ---
  const es = new EventSource('/events');
  es.onmessage = (ev) => ingest(JSON.parse(ev.data));
  es.onerror = () => { $('status').textContent = '连接断开,重连中…'; };
})();
</script>
</body>
</html>
